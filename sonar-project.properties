# =====================================================
# 1. 專案基本設定 (Project Metadata)
# =====================================================
sonar.projectKey=jiatoudau_llmcr
sonar.organization=jiatoudau
sonar.projectName=llmcr
sonar.sourceEncoding=UTF-8

# =====================================================
# 2. 核心路徑劃分 (核心修改：用逗號分隔多個模組路徑)
# =====================================================
# 這裡填入所有「非測試」的原始碼資料夾
sonar.sources=spring-app/src/main/java,tui/source,evaluation,faiss_service

# 這裡填入所有「測試代碼」的根資料夾 (Java 測試跟 TS、Python 測試的目錄都放進來)
sonar.tests=spring-app/src/test/java,tui/source

# =====================================================
# 3. 排除與包含規則 (Exclusions & Inclusions)
# =====================================================
# 全域排除檔案
sonar.exclusions=**/node_modules/**,**/target/**,**/*.test.tsx,tui/source/testing-helpers.tsx

# 精準定義哪些檔案屬於「測試檔案」（避免 Sonar 把測試當成正式生產代碼計算行數）
sonar.test.inclusions=spring-app/src/test/java/**/*Test.java,tui/source/**/*.test.tsx,tui/source/testing-helpers.tsx

# =====================================================
# 4. Java 專屬設定 & 測試覆蓋率
# =====================================================
sonar.java.binaries=spring-app/target/classes
sonar.java.test.binaries=spring-app/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=spring-app/target/site/jacoco/jacoco.xml

# =====================================================
# 5. JavaScript / TypeScript 專屬設定
# =====================================================
sonar.typescript.tsconfigPath=tui/tsconfig.json
sonar.javascript.lcov.reportPaths=tui/coverage/lcov.info

# =====================================================
# 6. Python 專屬設定 (新增這段讓 Python 生效)
# =====================================================
# 宣告專案支援的 Python 版本 (經官方驗證存在的欄位)
sonar.python.version=3.12
# 匯入 Python 的 Cobertura XML 測試覆蓋率報告路徑
# sonar.python.coverage.reportPaths=python-app/coverage.xml
