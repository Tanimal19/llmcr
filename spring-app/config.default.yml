# Track roots are the top-level directories that will be tracked by the application.
# Each track root can be a directory or a file, and it can have an optional list of allowed source types.
# - The avaliable source types are: JAVACODE, ASCIIDOC, MARKDOWN, PDF, JSON.
#
# All tracked files will be transformed using ETL and stored in the vector database,
# and will be used to perform RAG.
track-roots:
  - id: "spring-ai-main-code"
    path: "../_datasets/projects/spring-ai-main/"
    allowed-source-types:
      - JAVACODE

  - id: "spring-ai-main-docs"
    path: "../_datasets/projects/spring-ai-main/spring-ai-docs/src/main/antora/modules/ROOT/pages/"
    allowed-source-types:
      - ASCIIDOC

  - id: "docs"
    path: "../_datasets/docs/"

  - id: "guidelines"
    path: "../_datasets/guidelines/"
    allowed-source-types:
      - MARKDOWN
      - PDF

  - id: "usecases"
    path: "../_datasets/usecases/"
    allowed-source-types:
      - JSON

# Collections are logical groupings of track roots that can be used to perform RAG on specific subsets of the data.
# If no collections are defined, all track roots will be included in a default collection named "all".
collections:
  "project-code":
    track-roots:
      - "spring-ai-main-code"

  "project-context":
    track-roots:
      - "spring-ai-main-code"
      - "spring-ai-main-docs"

  "docs":
    track-roots:
      - "spring-ai-main-docs"
      - "docs"

  "guidelines":
    track-roots:
      - "guidelines"

  "usecases":
    track-roots:
      - "usecases"

# Each model has a unique name, a provider, and a type.
chat-models:
  "nemotron-3-4b":
    name: "nemotron-3-4b"
    provider: "openai"

  "phi-4-mini":
    name: "phi-4-mini"
    provider: "openai"

  "llama-3.1-8b":
    name: "llama-3.1-8b"
    provider: "openai"

  "gemini-2.5-flash-lite":
    name: "gemini-2.5-flash-lite"
    provider: "google"

embedding-model:
  name: "harrier-0.6b"
  provider: "openai"

reranking-model:
  name: "qwen3-reranker-0.6b"
  provider: "openai"

# Set each agent's chat model
agents:
  classNodeEnrich:
    chat: "nemotron-3-4b"
    collection: "project-context"

  questionAnswering:
    chat: "nemotron-3-4b"
    collection: "all"

  interpretation:
    chat: "gemini-2.5-flash-lite"
    collection: "project-context"

  planning:
    chat: "gemini-2.5-flash-lite"
    collection: "guidelines"

  computation:
    chat: "nemotron-3-4b"

  retrieval:
    chat: "nemotron-3-4b"

  summary:
    chat: "gemini-2.5-flash-lite"

logging:
  review-output-dir: "../reviews"
