# Set dataset paths, do not modify the structure of the dataset. Leave blank if not applicable.
datasets:
  proj-code-dir: "datasets/projects/spring-ai-src"
  proj-docs-dir: "datasets/projects/spring-ai-src/spring-ai-docs/src/main/antora/modules/ROOT/pages/s"
  proj-issues-dir: "datasets/projects/spring-ai-issues"
  proj-prs-dir: "datasets/projects/spring-ai-prs"
  review-guideline-json: "datasets/code-review-guideline.json"
  docs-dir: "datasets/docs"

models:
  # at least one chat model is required
  chat-models:
    - name: "nemotron-3-4b"
      provider: "openai"
    - name: "gemini-3.1-flash-lite"
      provider: "google"
    - name: "gemini-3.1-pro-preview"
      provider: "google"

  # only one embedding model is allowed
  embedding-model:
    name: "harrier-0.6b"
    provider: "openai"

  # only one reranking model is allowed, this is optional
  reranking-model:

# Specify which models to use for each agent, the model must be defined in the models section above
agents:
  default-chat-model: "nemotron-3-4b"
  enricher-slm: "nemotron-3-4b"
  interpretation-llm: "gemini-3.1-flash-lite"
  drafting-llm: "gemini-3.1-flash-lite"
  computation-slm: "nemotron-3-4b"
  retrieval-slm: "nemotron-3-4b"
  summary-llm: "gemini-3.1-flash-lite"

logging:
  review-output-dir: "./exports/"
