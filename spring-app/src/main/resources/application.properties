spring.application.name=llmcr

# MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/ragdb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# FAISS
llmcr.faiss.url=http://localhost:8000

# Disable Spring AI auto-configuration
spring.ai.chat.client.enabled=false
spring.ai.embedding.client.enabled=false

# Model Providers
spring.ai.openai.api-key=none
spring.ai.openai.base-url=http://localhost:8080
spring.ai.google.genai.api-key=${GOOGLE_GEMINI_API_KEY}

# Models
llmcr.embedding.provider=openai
llmcr.embedding.model=Harrier-0.6b

llmcr.reranking.provider=openai
llmcr.reranking.model=Qwen3-Reranker-0.6b

llmcr.agent.classNodeEnrich.chat.provider=openai
llmcr.agent.classNodeEnrich.chat.model=Phi-4-Mini

llmcr.agent.question-answer.chat.provider=openai
llmcr.agent.question-answer.chat.model=Phi-4-Mini

llmcr.agent.interpretation.chat.provider=google
llmcr.agent.interpretation.chat.model=gemini-2.5-flash-lite

llmcr.agent.planning.chat.provider=google
llmcr.agent.planning.chat.model=gemini-2.5-flash-lite

llmcr.agent.computation.chat.provider=openai
llmcr.agent.computation.chat.model=Phi-4-Mini

llmcr.agent.retrieval.chat.provider=openai
llmcr.agent.retrieval.chat.model=LFM2.5-1.2B

llmcr.agent.summary.chat.provider=openai
llmcr.agent.summary.chat.model=Phi-4-Mini

# Modules
llmcr.retrieval.topN=1000
llmcr.retrieval.maxQueryLength=4096

# Logging
logging.pattern.console=[%d{yyyy-MM-dd HH:mm:ss}] [%p] %logger{0}: %msg%n
logging.level.root=INFO
# logging.level.org.springframework.ai.chat.client.advisor=DEBUG
llmcr.agent.log.file=../logs/agent_execution.log
llmcr.review.output-dir=../logs/reviews/