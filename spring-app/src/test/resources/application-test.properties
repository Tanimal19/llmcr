spring.application.name=llmcr-test

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# FAISS mock url
llmcr.faiss.url=http://localhost:8000

# Disable Spring AI auto-configuration
spring.ai.chat.client.enabled=false
spring.ai.embedding.client.enabled=false

# Dummy Model Providers
spring.ai.openai.api-key=dummy
spring.ai.openai.base-url=http://localhost:8080
spring.ai.google.genai.api-key=dummy

# Logging
logging.pattern.console=[%d{yyyy-MM-dd HH:mm:ss}] [%p] %logger{0}: %msg%n
logging.level.root=INFO

# Config path
config.path=./test/resources/config.test.yml

# API Server
server.port=8081
server.cors.allowed-origins=*
