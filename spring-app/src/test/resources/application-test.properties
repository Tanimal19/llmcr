spring.application.name=llmcr-test

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# FAISS mock url
llmcr.faiss.url=http://localhost:8000

# Disable Spring AI auto-configuration
spring.ai.chat.client.enabled=false
spring.ai.embedding.client.enabled=false

# Dummy Model Providers
spring.ai.openai.api-key=dummy
spring.ai.openai.base-url=http://localhost:8080
spring.ai.google.genai.api-key=dummy

# Models
llmcr.embedding.provider=openai
llmcr.embedding.model=dummy-embedding-model

llmcr.reranking.provider=openai
llmcr.reranking.model=dummy-rerank-model

llmcr.agent.classNodeEnrich.chat.provider=openai
llmcr.agent.classNodeEnrich.chat.model=dummy-chat-model

llmcr.agent.question-answer.chat.provider=openai
llmcr.agent.question-answer.chat.model=dummy-chat-model

llmcr.agent.interpretation.chat.provider=google
llmcr.agent.interpretation.chat.model=dummy-chat-model

llmcr.agent.planning.chat.provider=google
llmcr.agent.planning.chat.model=dummy-chat-model

llmcr.agent.computation.chat.provider=openai
llmcr.agent.computation.chat.model=dummy-chat-model

llmcr.agent.retrieval.chat.provider=openai
llmcr.agent.retrieval.chat.model=dummy-chat-model

llmcr.agent.summary.chat.provider=google
llmcr.agent.summary.chat.model=dummy-chat-model

# Modules
llmcr.retrieval.topN=10
llmcr.retrieval.maxQueryLength=4096

# Logging
logging.level.root=INFO
llmcr.agent.log.file=target/logs/agent_execution_test.log
llmcr.review.output-dir=target/logs/reviews_test/
