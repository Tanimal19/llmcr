name: SonarCloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

# 提早啟用 Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sonarcloud:
    name: Combined Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # 環境初始化：同時準備好 Java 21 與 Node.js
      # --------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # --------------------------------------------------------
      # 步驟 1-1：後端程式碼風格檢查 (Java Prettier)
      # --------------------------------------------------------
      - name: Run Backend Lint (Spotless)
        run: |
          cd spring-app
          mvn spotless:check

      # --------------------------------------------------------
      # 步驟 1-2：後端測試與編譯
      # 關鍵：即使上面的 Java 排版沒過，這裡依然會強行啟動 Docker 並執行所有測試！
      # --------------------------------------------------------
      - name: Run Backend Tests & Compile
        if: success() || failure()
        run: |
          docker compose up -d
          cd spring-app
          cp config.default.yml config.yml
          mvn verify

      # --------------------------------------------------------
      # 步驟 2-1：前端程式碼風格檢查 (Lint)
      # --------------------------------------------------------
      - name: Run Frontend Lint (Prettier & XO)
        if: success() || failure()
        run: |
          cd tui
          npm ci --ignore-scripts
          npm run lint

      # --------------------------------------------------------
      # 步驟 2-2：前端測試與編譯
      # 關鍵：即使上面的 Lint 失敗了，這個步驟依然會強制執行
      # --------------------------------------------------------
      - name: Run Frontend Tests & Build
        if: success() || failure()
        run: |
          cd tui
          npm run test:coverage
          npm run build

      # --------------------------------------------------------
      # 步驟 3：綜合掃描（自動讀取 sonar-project.properties 裡設定好的報告路徑）
      # 不論前後端測試結果如何，都要把當前的報告與程式碼送上雲端
      # --------------------------------------------------------
      - name: Combined SonarQube Scan
        if: success() || failure()
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.java.libraries=/home/runner/.m2/repository/**/*.jar
            -Dsonar.java.test.libraries=/home/runner/.m2/repository/**/*.jar
