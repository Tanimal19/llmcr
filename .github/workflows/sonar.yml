name: SonarCloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

# 提早啟用 Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sonarcloud:
    name: Combined Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------------
      # 環境初始化：同時準備好 Java 21 與 Node.js
      # --------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # --------------------------------------------------------
      # 步驟 1：後端測試（內建自動編譯，並生成 JaCoCo 覆蓋率報告）
      # --------------------------------------------------------
      - name: Run Backend Tests & Compile
        run: |
          cd spring-app
          cp config.default.yml config.yml
          mvn verify -DskipITs=true

      # --------------------------------------------------------
      # 步驟 2：前端測試（安裝依賴，並用 c8 幫 AVA 生成 lcov 報告）
      # 不論後端成功或失敗，前端測試都必須執行
      # --------------------------------------------------------
      - name: Run Frontend Tests
        if: success() || failure()
        run: |
          cd tui
          npm ci --ignore-scripts
          ./node_modules/.bin/c8 --reporter=lcov ./node_modules/.bin/ava

      # --------------------------------------------------------
      # 步驟 3：綜合掃描（自動讀取 sonar-project.properties 裡設定好的報告路徑）
      # 不論前後端測試結果如何，都要把當前的報告與程式碼送上雲端
      # --------------------------------------------------------
      - name: Combined SonarQube Scan
        if: success() || failure()
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
